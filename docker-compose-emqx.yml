version: '3.8'

services:
  emqx:
    image: emqx/emqx:latest
    container_name: radar-emqx
    ports:
      - "1883:1883"      # MQTT TCP
      - "8083:8083"      # MQTT WebSocket
      - "8084:8084"      # MQTT WebSocket SSL
      - "8883:8883"      # MQTT TCP SSL
      - "18083:18083"    # Dashboard
    environment:
      - EMQX_NAME=radar-emqx
      - EMQX_HOST=127.0.0.1
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    restart: unless-stopped
    networks:
      - radar-network

networks:
  radar-network:
    driver: bridge

volumes:
  emqx-data:
  emqx-log:

